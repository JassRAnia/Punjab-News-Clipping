name: Daily News Clipping

on:
  schedule:
    # 02:30 UTC is approximately 08:00 AM IST.
    - cron: '30 2 * * *'
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-clipping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
          
      - name: Run E-Paper Scraper and Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python clipping_script.py

      - name: Verify outputs generated
        run: ls -lh reports/

      - name: Upload PDF Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Daily-News-Reports
          path: reports/*.pdf

      - name: Push PDFs back to the Repository (Optional)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add reports/
          git diff-index --quiet HEAD || git commit -m "Auto-generated daily news PDFs"
          git push
